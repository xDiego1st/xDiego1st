<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" width="1280" height="150" role="img" aria-label="Coffee and Code — Rasyid Abdul Halim">
  <defs>
    <clipPath id="footerClip">
      <rect x="1" y="1" width="1278" height="148" rx="18" ry="18"/>
    </clipPath>

    <linearGradient id="fBgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="50%" stop-color="#141b2d"/>
      <stop offset="100%" stop-color="#1a2540"/>
    </linearGradient>

    <linearGradient id="fWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70a5fd"/>
      <stop offset="50%" stop-color="#38bdae"/>
      <stop offset="100%" stop-color="#bf91f3"/>
    </linearGradient>

    <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .f-quote {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .f-meta {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .f-cursor {
      animation: fBlink 1.1s step-end infinite;
    }
    @keyframes fBlink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }
  </style>

  <g clip-path="url(#footerClip)">
    <rect width="1280" height="150" fill="url(#fBgGrad)"/>

    <!-- 3-layer animated morphing ocean/tech waves (kept cleanly below footer text) -->
    <path fill="url(#fWaveGrad)" opacity="0.35">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,104 Q320,82 640,106 T1280,96 L1280,150 L0,150 Z;
                M0,94 Q320,122 640,94 T1280,112 L1280,150 L0,150 Z;
                M0,110 Q320,88 640,112 T1280,92 L1280,150 L0,150 Z;
                M0,104 Q320,82 640,106 T1280,96 L1280,150 L0,150 Z"/>
    </path>

    <path fill="url(#fWaveGrad)" opacity="0.28">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M0,116 Q320,136 640,108 T1280,118 L1280,150 L0,150 Z;
                M0,106 Q320,88 640,120 T1280,102 L1280,150 L0,150 Z;
                M0,120 Q320,98 640,108 T1280,124 L1280,150 L0,150 Z;
                M0,116 Q320,136 640,108 T1280,118 L1280,150 L0,150 Z"/>
    </path>

    <path fill="url(#fWaveGrad)" opacity="0.22">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="M0,126 Q320,110 640,128 T1280,120 L1280,150 L0,150 Z;
                M0,120 Q320,138 640,118 T1280,132 L1280,150 L0,150 Z;
                M0,128 Q320,114 640,126 T1280,116 L1280,150 L0,150 Z;
                M0,126 Q320,110 640,128 T1280,120 L1280,150 L0,150 Z"/>
    </path>

    <!-- Animated glowing signal streaks riding wave horizon -->
    <path fill="none" stroke="url(#crestGrad)" stroke-width="2.2" stroke-dasharray="120 360" filter="url(#fGlow)" opacity="0.9">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,104 Q320,82 640,106 T1280,96;
                M0,94 Q320,122 640,94 T1280,112;
                M0,110 Q320,88 640,112 T1280,92;
                M0,104 Q320,82 640,106 T1280,96"/>
      <animate attributeName="stroke-dashoffset" from="480" to="0" dur="4.2s" begin="-1.5s" repeatCount="indefinite"/>
    </path>
    <path fill="none" stroke="#38bdae" stroke-width="1.6" stroke-dasharray="85 420" filter="url(#fGlow)" opacity="0.75">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M0,116 Q320,136 640,108 T1280,118;
                M0,106 Q320,88 640,120 T1280,102;
                M0,120 Q320,98 640,108 T1280,124;
                M0,116 Q320,136 640,108 T1280,118"/>
      <animate attributeName="stroke-dashoffset" from="0" to="505" dur="5.6s" begin="-2.3s" repeatCount="indefinite"/>
    </path>

    <!-- Twinkling floating particles -->
    <g filter="url(#fGlow)">
      <circle cx="140" cy="48" r="2.2" fill="#70a5fd">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 14,-10; 0,0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="245" cy="96" r="2.0" fill="#38bdae">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" begin="1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; -12,-14; 0,0" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="46" r="2.2" fill="#38bdae">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" begin="0.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; -16,-8; 0,0" dur="7.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1145" cy="92" r="2.4" fill="#bf91f3">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.4s" begin="1.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 10,-14; 0,0" dur="8.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Centered Footer Tagline (cleanly above wave crests) -->
    <text x="640" y="48" text-anchor="middle" fill="#e2e8f0" class="f-quote">Coffee &amp; Code — Building reliable systems, one commit at a time.</text>
    <text x="640" y="75" text-anchor="middle" fill="#7dd3fc" class="f-meta">github.com/xDiego1st  •  Indonesia  •  Open for Collaboration <tspan class="f-cursor">_</tspan></text>
  </g>

  <rect x="1" y="1" width="1278" height="148" rx="18" ry="18" fill="none" stroke="#292e42" stroke-width="1.5"/>
</svg>
